<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikita Workshop</title>
<meta name="description" content="Nikita Workshop LLC — Photo and Video, Drone Stuff, and Social Media.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Nikita Workshop">
<meta property="og:description" content="Photo and Video, Drone Stuff, and Social Media.">
<meta property="og:image" content="https://nikitaaaaaaaa8.github.io/nikitaworkshop.com/assets/og-1200x630.jpg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/video/poster-closed.webp" type="image/webp">
<style>
:root{
  --cream:#f7ecd9; --cream-2:#efdcbd; --wood:#c58a4e; --wood-dark:#7a4a24; --ink:#43280f;
  --glow:#ffc15a; --glow-soft:rgba(255,193,90,.28);
  --S:min(88vw,76vh,760px);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@supports (height:100dvh){:root{--S:min(88vw,76dvh,760px)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
img{display:block;max-width:none;-webkit-user-drag:none;user-select:none}
a,button{touch-action:manipulation}
[hidden]{display:none!important}

/* ---------- ROOM (sits under the intro) ---------- */
#room{position:fixed;inset:0;background:#c98e57;z-index:1}
.scroll{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(#d58c55 0 50%,#be6f3c 50% 100%)}
.scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100vw,177.7778vh);aspect-ratio:16/9}
@supports (height:100dvh){.scene{width:max(100vw,177.7778dvh)}}
.scene>picture{display:block;width:100%;height:100%}
.scene-img{width:100%;height:100%;object-fit:fill}
/* stove-fire loop: a small 3x-upscaled crop (x832-1264, y448-720 of the 1280x720 room) placed by %, feathered into the still */
.fire{position:absolute;left:65%;top:62.2222%;width:33.75%;height:37.7778%;object-fit:fill;pointer-events:none;opacity:0;
  transition:opacity .9s ease;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 14%,#000 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 14%,#000 100%);mask-composite:intersect}
.fire.on{opacity:1}
.brand{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:18px;font-weight:700;letter-spacing:.04em;
  font-size:13px;color:#fff7ea;text-shadow:0 1px 6px rgba(70,35,8,.55);pointer-events:none}
.hint{position:absolute;z-index:3;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;margin:0;
  font-size:13px;color:#fff7ea;text-shadow:0 1px 6px rgba(70,35,8,.65);pointer-events:none;
  transition:opacity .8s ease .2s}
.hint .t{display:none}
.hint .m{display:inline}
@media (hover:hover) and (pointer:fine){.hint .t{display:inline}.hint .m{display:none}}
#room.interacted .hint{opacity:0}

/* Hotspots are positioned in image units (1024x576) as % of the scene box, so they track the image at every size */
.hs{position:absolute;display:block;color:inherit;text-decoration:none;
  left:calc(var(--cx)*100%/1024);top:calc(var(--cy)*100%/576);
  width:calc(var(--w)*100%/1024);height:calc(var(--h)*100%/576);
  min-width:48px;min-height:48px;transform:translate(-50%,-50%);border-radius:14px;outline:none;cursor:pointer}
.hs .ring{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:2px solid transparent;background:transparent;transition:background .22s,border-color .22s,box-shadow .22s}
.hs .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:var(--glow);box-shadow:0 0 0 0 rgba(255,193,90,.7);opacity:0;pointer-events:none}
.hs .tag{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px);white-space:nowrap;
  background:var(--cream);color:var(--ink);font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;
  box-shadow:0 6px 18px rgba(60,30,6,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2}
.hs.tag-below .tag{bottom:auto;top:calc(100% + 8px)}
/* Hover styling only for real hover devices: touch gets a direct, single-tap open (no hover-preview step) */
@media (hover:hover) and (pointer:fine){
  .hs:hover .ring{background:var(--glow-soft);border-color:rgba(255,214,140,.95);box-shadow:0 0 22px 6px rgba(255,190,80,.55),inset 0 0 18px rgba(255,220,150,.45)}
  .hs:hover .tag{opacity:1;transform:translate(-50%,0)}
  .scene:has(.hs[data-sec="photo"]:hover)  .hs[data-sec="photo"]  .ring,
  .scene:has(.hs[data-sec="drone"]:hover)  .hs[data-sec="drone"]  .ring,
  .scene:has(.hs[data-sec="social"]:hover) .hs[data-sec="social"] .ring
    {background:var(--glow-soft);border-color:rgba(255,214,140,.95);box-shadow:0 0 22px 6px rgba(255,190,80,.55),inset 0 0 18px rgba(255,220,150,.45)}
}
.hs:focus-visible .ring{background:var(--glow-soft);border-color:rgba(255,214,140,.95);box-shadow:0 0 22px 6px rgba(255,190,80,.55),inset 0 0 18px rgba(255,220,150,.45)}
.hs:focus-visible .tag{opacity:1;transform:translate(-50%,0)}
.scene:has(.hs[data-sec="photo"]:focus-visible)  .hs[data-sec="photo"]  .ring,
.scene:has(.hs[data-sec="drone"]:focus-visible)  .hs[data-sec="drone"]  .ring,
.scene:has(.hs[data-sec="social"]:focus-visible) .hs[data-sec="social"] .ring
  {background:var(--glow-soft);border-color:rgba(255,214,140,.95);box-shadow:0 0 22px 6px rgba(255,190,80,.55),inset 0 0 18px rgba(255,220,150,.45)}

/* Portrait phones: the wide room is a horizontally swipeable strip, centred, with the wall colours filling above/below */
@media (orientation:portrait){
  .scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .scroll::-webkit-scrollbar{display:none}
  .scene{position:relative;left:auto;top:auto;transform:none;flex:none;
    height:72vh;width:calc(72vh*16/9);margin-top:calc((100vh - 72vh)/2);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%)}
  @supports (height:100dvh){.scene{height:72dvh;width:calc(72dvh*16/9);margin-top:calc((100dvh - 72dvh)/2)}}
}

/* ---------- INTRO (video clips) ---------- */
#intro{position:fixed;inset:0;z-index:5;overflow:hidden}
#wbg{position:absolute;inset:0;background:#fff}
.house{position:absolute;left:50%;top:50%;width:var(--S);height:var(--S);margin:calc(var(--S)/-2) 0 0 calc(var(--S)/-2);
  padding:0;border:0;background:none;cursor:pointer;display:block;outline:none;border-radius:6%;overflow:hidden}
.house:focus-visible{outline:3px solid var(--wood);outline-offset:4px}
.house>img,.house>video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.house>video{opacity:0}
.house>video.on{opacity:1}
#vDoor.fade{transition:opacity .14s linear}
#posterOpen{opacity:0;transition:opacity .45s ease}
#vPush{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%;
  opacity:0;pointer-events:none;will-change:transform;object-fit:fill}
#vPush.on{opacity:1}
.call{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:#a47a4e;opacity:0;pointer-events:none}
#intro.ready .call{animation:callin .9s ease .3s forwards}
@keyframes callin{to{opacity:.85}}
.skip{position:absolute;z-index:6;top:max(12px,env(safe-area-inset-top));right:14px;border:0;background:none;color:#a47a4e;font:600 12px var(--font);
  letter-spacing:.08em;text-transform:uppercase;padding:12px 10px;min-height:44px;opacity:.65;cursor:pointer}
.skip:hover,.skip:focus-visible{opacity:1;text-decoration:underline}
#intro.busy .call,#intro.busy .skip{animation:none;transition:opacity .25s;opacity:0}
#intro.busy .skip{pointer-events:none}
#room.hold .scene{opacity:0}
@media (orientation:portrait){#vPush{--ea:1;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--ea)) 0,#000 5%,#000 95%,rgba(0,0,0,var(--ea)) 100%);mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--ea)) 0,#000 5%,#000 95%,rgba(0,0,0,var(--ea)) 100%)}}

/* ---------- SECTION PANELS ---------- */
#panels{position:fixed;inset:0;z-index:8;pointer-events:none}
.panel{position:absolute;inset:0;overflow:auto;background:
   radial-gradient(1200px 600px at 50% -10%,#fff6e6,transparent 70%),var(--cream);
   opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease;pointer-events:none;visibility:hidden}
.panel.show{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.panel-in{max-width:640px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 24px 56px}
.back-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--wood-dark);font-weight:700;text-decoration:none;font-size:15px;
  padding:0 14px 0 6px;margin-left:-6px;border-radius:999px}
.back-link:hover,.back-link:focus-visible{background:rgba(197,138,78,.16);outline:none}
.art{width:min(220px,58%);aspect-ratio:var(--ar);margin:18px 0 6px;border-radius:22px;background-image:url(assets/room-2560.webp);background-image:image-set(url(assets/room-2560.avif) type('image/avif'),url(assets/room-2560.webp) type('image/webp'));background-repeat:no-repeat;
  background-size:var(--bs);background-position:var(--bp);box-shadow:0 12px 30px rgba(90,50,12,.25),inset 0 0 0 3px rgba(255,236,200,.55)}
.panel h1{font-size:clamp(30px,8vw,44px);line-height:1.08;margin:18px 0 10px;letter-spacing:-.01em;outline:none}
.panel p.lead{font-size:clamp(17px,4.6vw,20px);line-height:1.45;margin:0 0 18px;color:#5b3a1c}
.note{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood-dark);background:var(--cream-2);
  border-radius:999px;padding:6px 12px;margin:0 0 26px}
.contact-links{display:flex;flex-direction:column;gap:10px;margin:0 0 26px}
.contact-links a{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:14px;background:var(--wood-dark);color:#fff7ea;text-decoration:none;font-weight:700;width:fit-content;max-width:100%}
.more{border-top:1px solid rgba(122,74,36,.22);padding-top:18px;margin-top:8px}
.more h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:var(--wood-dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;border-radius:999px;background:#fff8ec;border:1px solid rgba(122,74,36,.25);
  color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.chips a:hover,.chips a:focus-visible{background:var(--glow-soft);border-color:var(--wood);outline:none}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .panel{transition:opacity .2s;transform:none}
  .hs .dot{animation:none!important}
  .hs .tag,.hs .ring{transition:none}
  .fire{transition:none}
}
noscript .ns{position:fixed;inset:0;z-index:20;background:#fff;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--font)}
</style>
</head>
<body>

<!-- ROOM -->
<main id="room" class="hold" inert aria-label="Inside the workshop">
  <span class="brand" aria-hidden="true">NIKITA WORKSHOP</span>
  <div class="scroll" id="scroller">
    <div class="scene" id="scene">
      <picture>
        <source type="image/avif" srcset="assets/room-1280.avif 1280w, assets/room-2560.avif 2560w, assets/room-3840.avif 3840w" sizes="(orientation:portrait) calc(72vh*1.7778), max(100vw,177.7778vh)">
        <source type="image/webp" srcset="assets/room-1280.webp 1280w, assets/room-2560.webp 2560w, assets/room-3840.webp 3840w" sizes="(orientation:portrait) calc(72vh*1.7778), max(100vw,177.7778vh)">
        <img class="scene-img" id="roomImg" src="assets/room-1280.webp" width="1280" height="720" decoding="async"
             alt="Inside the Nikita Workshop: a wooden room with a camera on a tripod, a desk with a lamp and a video-editing monitor, a pegboard with a drone controller and headphones, a pencil, a drone on a shelf and a wood stove.">
      </picture>
      <!-- cx, cy, w, h are in image units on a 1024x576 grid -->
      <video class="fire" id="vFire" muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <a class="hs" href="#/social" data-sec="social" style="--cx:207;--cy:228;--w:44;--h:140"><span class="ring"></span><span class="dot"></span><span class="tag">Social Media</span></a>
      <a class="hs" href="#/photo"  data-sec="photo"  style="--cx:215;--cy:416;--w:140;--h:250"><span class="ring"></span><span class="dot"></span><span class="tag">Photo and Video</span></a>
      <a class="hs" href="#/drone"  data-sec="drone"  style="--cx:298;--cy:227;--w:90;--h:90"><span class="ring"></span><span class="dot"></span><span class="tag">Drone Stuff</span></a>
      <a class="hs" href="#/social" data-sec="social" style="--cx:376;--cy:342;--w:92;--h:112"><span class="ring"></span><span class="dot"></span><span class="tag">Social Media</span></a>
      <a class="hs" href="#/photo"  data-sec="photo"  style="--cx:501;--cy:337;--w:152;--h:134"><span class="ring"></span><span class="dot"></span><span class="tag">Photo and Video</span></a>
      <a class="hs" href="#/drone"  data-sec="drone"  style="--cx:722;--cy:331;--w:208;--h:68"><span class="ring"></span><span class="dot"></span><span class="tag">Drone Stuff</span></a>
      <a class="hs tag-below" href="#/contact" data-sec="contact" style="--cx:852;--cy:462;--w:174;--h:158"><span class="ring"></span><span class="dot"></span><span class="tag">Contact</span></a>
    </div>
  </div>
  <p class="hint"><span class="t">Hover over anything in the room — it’s all clickable</span><span class="m">Swipe to look around · tap anything</span></p>
</main>

<!-- INTRO -->
<div id="intro">
  <div id="wbg"></div>
  <button class="skip" id="skip" type="button">Skip</button>
  <button class="house" id="house" type="button" aria-label="Open the workshop door">
    <img id="posterClosed" src="assets/video/poster-closed.webp" width="1024" height="1024" fetchpriority="high" decoding="async"
         alt="Nikita Workshop logo: a small wooden workshop with a closed barn door, a lit window and smoke drifting from the chimney">
    <img id="posterOpen" src="assets/video/poster-open.webp" width="1024" height="1024" alt="" decoding="async">
    <video id="vClosed" muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
    <video id="vDoor" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
  </button>
  <video id="vPush" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
  <div class="call" aria-hidden="true">Tap the door</div>
</div>

<!-- SECTIONS (placeholder pages) -->
<div id="panels"></div>

<noscript><div class="ns"><div><h1>Nikita Workshop</h1><p>This page needs JavaScript. Email <a href="mailto:hello@nikitaworkshop.com">hello@nikitaworkshop.com</a>.</p></div></div></noscript>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- section content (placeholder copy; Nikita can edit freely) ---- */
  // art = crop box of the room image in 1024x576 units: [x, y, w, h]
  const SECTIONS = {
    photo:   { title: 'Photo and Video', line: 'Photography and video editing.',                         art: [145, 268, 432, 274] },
    drone:   { title: 'Drone Stuff',     line: 'Aerial photo and video.',                               art: [616, 296, 214, 72] },
    social:  { title: 'Social Media',    line: 'Social media and marketing that fits your business.',   art: [186, 156, 236, 242] },
    contact: { title: 'Contact',         line: 'Say hello.',                                            art: [764, 386, 178, 158], contact: true },
  };
  const ORDER = ['photo','drone','social','contact'];
  const ALIAS = { video: 'photo', marketing: 'social', computer: 'drone', ai: 'social' };
  const esc = s => s.replace(/&/g, '&amp;');

  const panels = $('#panels');
  for (const id of ORDER) {
    const s = SECTIONS[id], [x, y, w, h] = s.art;
    const bs = (1024 / w * 100).toFixed(2) + '% auto';
    const bp = (x / (1024 - w) * 100).toFixed(2) + '% ' + (y / (576 - h) * 100).toFixed(2) + '%';
    const el = document.createElement('section');
    el.className = 'panel'; el.id = 'sec-' + id; el.setAttribute('aria-labelledby', 'h-' + id);
    el.innerHTML = `<div class="panel-in">
      <a class="back-link" href="#/room"><span aria-hidden="true">←</span> Back to the workshop</a>
      <div class="art" role="img" aria-label="${esc(s.title)} — from the workshop" style="--ar:${w}/${h};--bs:${bs};--bp:${bp}"></div>
      <h1 id="h-${id}" tabindex="-1">${esc(s.title)}</h1>
      <p class="lead">${esc(s.line)}</p>
      ${s.contact
        ? `<div class="contact-links"><a href="mailto:hello@nikitaworkshop.com">hello@nikitaworkshop.com</a><a href="https://instagram.com/nikitaworkshop" rel="noopener">@nikitaworkshop on Instagram</a></div>`
        : `<span class="note">Placeholder — details coming soon</span>`}
      <nav class="more" aria-label="More from the workshop"><h2>More from the workshop</h2><div class="chips">
        ${ORDER.filter(o => o !== id).map(o => `<a href="#/${o}">${esc(SECTIONS[o].title)}</a>`).join('')}
      </div></nav></div>`;
    panels.appendChild(el);
  }

  const room = $('#room'), intro = $('#intro'), scroller = $("#scroller");
  let introDone = false, opened = false, timer = 0, current = null, lastHs = null;

  /* ---- router: #/photo opens a section, anything else = room ---- */
  function route() {
    const raw = (location.hash.match(/^#\/([a-z]+)$/) || [])[1];
    const id = ALIAS[raw] || raw;
    const next = SECTIONS[id] ? id : null;
    if (next && !introDone) finishIntro();
    if (next === current) return;
    if (current) $('#sec-' + current).classList.remove('show');
    current = next;
    if (next) {
      const p = $('#sec-' + next);
      p.scrollTop = 0; p.classList.add('show');
      room.inert = true; room.classList.add('interacted');
      requestAnimationFrame(() => $('#h-' + next).focus({ preventScroll: true }));
    } else if (introDone) {
      room.inert = false;
      if (lastHs) lastHs.focus({ preventScroll: true });
    }
  }
  addEventListener('hashchange', route);
  addEventListener('keydown', e => { if (e.key === 'Escape' && current) location.hash = '#/room'; });
  room.addEventListener('click', e => { const a = e.target.closest('.hs'); if (a) lastHs = a; });
  room.addEventListener('pointerdown', () => room.classList.add('interacted'), { once: true });
  scroller.addEventListener('touchmove', () => room.classList.add('interacted'), { once: true, passive: true });

  /* ---- room framing (portrait: start the swipeable strip centred) ---- */
  function centreScroll() { scroller.scrollLeft = matchMedia('(orientation:portrait)').matches ? (scroller.scrollWidth - scroller.clientWidth) / 2 : 0; }
  addEventListener('resize', () => { if (introDone && matchMedia('(orientation:portrait)').matches && !room.classList.contains('interacted')) centreScroll(); });

  /* ---- intro: real animation clips ----
     closed-loop (smoke drifting) -> door-open -> push-in -> sharp interactive room.
     Geometry: the 1024px house videos are drawn S px wide; the 1280x720 push-in is drawn with its house (720px tall in the frame)
     the same S px, then eased up to exactly the room scene's size, so every handoff lines up pixel-for-pixel. */
  const house = $('#house'), wbg = $('#wbg'), roomImg = $('#roomImg'), sceneEl = $('#scene');
  const vClosed = $('#vClosed'), vDoor = $('#vDoor'), vPush = $('#vPush'), posterOpen = $('#posterOpen');
  const ua = navigator.userAgent;
  const apple = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(ua);
  const EXT = (!apple && document.createElement('video').canPlayType('video/webm; codecs="vp9"')) ? 'webm' : 'mp4';
  const vFire = $('#vFire');
  const CLIPS = { closed: [vClosed, 'closed-loop'], door: [vDoor, 'door-open'], push: [vPush, 'push-in'] };
  const FIRE = [vFire, 'fire-loop'];
  let fireStarted = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const raf = () => new Promise(r => requestAnimationFrame(r));
  const windowLoaded = new Promise(res => document.readyState === 'complete' ? res() : addEventListener('load', res, { once: true }));
  let closedPlaying = false, doorStart = null;
  const RATE = 1.1;                                          // door-open plays 10% faster
  const PUSH = 1.0;                                          // constant rate — changing it mid-clip hitches the camera

  function loadClip(key) {                                  // resolves true when the first frame is decodable, false on error/timeout
    const [v, name] = key === 'fire' ? FIRE : CLIPS[key];
    if (v.__ready) return v.__ready;
    return v.__ready = new Promise(res => {
      let ext = EXT, done = false;
      const fin = ok => { if (!done) { done = true; res(ok); } };
      v.addEventListener('loadeddata', () => fin(true), { once: true });
      v.addEventListener('error', () => { if (ext === 'webm') { ext = 'mp4'; v.src = `assets/video/${name}.mp4`; v.load(); } else fin(false); });
      v.muted = true; v.src = `assets/video/${name}.${ext}`; v.load();
      setTimeout(() => fin(false), 9000);
    });
  }
  function framePresented(v) {
    return new Promise(res => {
      if ('requestVideoFrameCallback' in v) { v.requestVideoFrameCallback(() => res()); setTimeout(res, 500); }
      else { let n = 0; (function t() { (v.currentTime > .03 || ++n > 15) ? res() : requestAnimationFrame(t); })(); }
    });
  }
  async function playClip(v) {                              // false when play() is refused (autoplay policy)
    try { await v.play(); } catch (e) { return false; }
    await framePresented(v); return true;
  }
  function nearEnd(v, margin) {
    return new Promise(res => (function t() { (v.ended || v.duration - v.currentTime <= margin) ? res() : requestAnimationFrame(t); })());
  }

  async function startFire() {                              // stove flames: starts at the hand-off so they are already moving
    if (fireStarted || reduce) return; fireStarted = true;
    try { if (!(await loadClip('fire'))) return; await vFire.play(); await framePresented(vFire); vFire.classList.add('on'); } catch (e) { console.info('fire loop unavailable'); }
  }
  function finishIntro() {
    if (introDone) return;
    startFire();
    introDone = true; clearTimeout(timer);
    for (const [v] of Object.values(CLIPS)) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} }
    intro.hidden = true; intro.setAttribute('aria-hidden', 'true');
    room.classList.remove('hold'); room.classList.add('ready');
    if (!current) room.inert = false;
    centreScroll();
  }
  async function fadeOut(ms) {                              // intro dissolves to the room; also the fallback path
    startFire();
    centreScroll(); room.classList.remove('hold');
    await intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'cubic-bezier(0.22, 0.08, 0.25, 1)', fill: 'forwards' }).finished;
    finishIntro();
  }
  async function bail() {                                   // video unavailable / refused: still-image fade
    for (const [v] of Object.values(CLIPS)) { try { v.pause(); } catch (e) {} v.classList.remove('on'); }
    posterOpen.style.opacity = 1; await sleep(650); await fadeOut(500);
  }

  async function runVideo() {
    const [okD, okP] = await Promise.all([loadClip('door'), loadClip('push')]);
    if (!okD || !okP) throw new Error('clips unavailable');
    // 1) closed loop -> door-open. Seamless at the loop boundary; otherwise a <150ms dissolve (only the smoke differs)
    if (doorStart) { if (!(await doorStart)) throw new Error('door refused'); await framePresented(vDoor); vDoor.classList.add('on'); }
    else {
      if (closedPlaying && vClosed.duration - vClosed.currentTime <= .3)
        await new Promise(res => (function t() { (vClosed.duration - vClosed.currentTime <= .045 || vClosed.currentTime < .1) ? res() : requestAnimationFrame(t); })());
      if (closedPlaying) vDoor.classList.add('fade');
      vDoor.playbackRate = RATE;
      if (!(await playClip(vDoor))) throw new Error('door refused');
      vDoor.classList.add('on');
      if (closedPlaying) { await sleep(170); vClosed.pause(); vClosed.classList.remove('on'); }
    }
    // 2) push-in through the doorway, scaled so its house matches the door-open house and its last frame matches the room scene
    centreScroll();
    const S = house.getBoundingClientRect().width, k0 = S / 720, k1 = sceneEl.getBoundingClientRect().width / 1280;
    const setScale = p => {
      const e = p * p * (3 - 2 * p);
      vPush.style.transform = `scale(${k0 + (k1 - k0) * e})`;
      const w = Math.min(1, Math.max(0, (p - .70) / .23)); const f = w * w * (3 - 2 * w); wbg.style.opacity = 1 - f; vPush.style.setProperty('--ea', 1 - f);
    };
    setScale(0);
    await nearEnd(vDoor, .04 * RATE);
    vPush.playbackRate = PUSH;
    if (!(await playClip(vPush))) throw new Error('push refused');
    vPush.classList.add('on'); vDoor.classList.remove('on'); vDoor.classList.remove('fade');
    let fading = null;
    await new Promise(res => (function t() {
      const p = Math.min(1, vPush.currentTime / (vPush.duration || 3));
      setScale(p);
      if (p > .72) startFire();
      // dissolve starts before the clip ends, so the camera never hard-stops and then sits
      if (!fading && (vPush.ended || p >= .85)) {
        fading = (async () => {
          try { await roomImg.decode(); } catch (e) {}
          await fadeOut(800);
        })().then(res);
      }
      if (!vPush.ended && p < .998) requestAnimationFrame(t);
      else setScale(1);
    })());
  }

  async function openDoor(kind) {
    if (opened) return; opened = true; clearTimeout(timer);
    intro.classList.add('busy');
    if (kind === 'skip') { await fadeOut(250); return; }
    if (reduce) { await fadeOut(450); return; }
    if (kind === 'tap' && !closedPlaying) {                 // autoplay was refused: unlock the clips inside this tap
      vDoor.muted = vPush.muted = true;
      vDoor.playbackRate = RATE; vPush.playbackRate = PUSH;
      doorStart = vDoor.play().then(() => true, () => false);
      vPush.play().then(() => { vPush.pause(); vPush.currentTime = 0; }, () => {});
    }
    try { await runVideo(); } catch (e) { console.info('intro fallback:', e.message); if (!introDone) await bail(); }
  }

  house.addEventListener('click', () => openDoor('tap'));
  $('#skip').addEventListener('click', () => openDoor('skip'));

  // idle: closed-door loop with drifting smoke; auto-open ~1.9s after it starts (or on tap, whichever first)
  (async () => {
    if (!reduce && !introDone) {
      if (await loadClip('closed')) {
        closedPlaying = await playClip(vClosed);
        if (closedPlaying) vClosed.classList.add('on');
      }
      loadClip('door').then(() => loadClip('push')).then(() => loadClip('fire'));        // warm the next clips while the loop idles
    }
    await windowLoaded;
    if (introDone || opened) return;
    intro.classList.add('ready');
    timer = setTimeout(() => openDoor('auto'), 1300);
  })();

  route();   // a deep link such as #/photo skips the intro
})();
</script>
</body>
</html>
